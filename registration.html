<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f4f8;
    }
    .card {
      width: 100%;
      max-width: 360px;
      padding: 32px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 24px; font-size: 24px; text-align: center; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #444; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #ccd0d8;
      border-radius: 6px;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #1e9e5a;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #178049; }
    .switch { margin-top: 16px; text-align: center; font-size: 14px; }
    .switch a { color: #1e9e5a; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Account</h1>
    <form action="#" method="post">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" minlength="6" required>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" placeholder="Repeat password" minlength="6" required>

      <button type="submit">Register</button>
    </form>
    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</body>
</html>
